name: CI Build (push)

# 推送任意分支即触发自动编译：
#   - 编译全部模块（core + bukkit + nukkit），产物上传到 Actions Artifacts，不创建 Release
#   - 打 tag (v*) 的推送走 build-release.yml，不会被本 workflow 重复触发
#   - 同一分支新推送会取消尚未跑完的旧构建，避免 self-hosted runner 排队堆积
#
# 与 build-release.yml 一致使用 self-hosted runner（GitHub 托管 runner 存在
# JVM 出网隔离问题，无法解析依赖）。自托管 runner 要求：JDK 21、能正常访问外网。

on:
  push:
    branches:
      - '**'   # 所有分支；指定 branches 后 tag 推送不触发
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build all modules (core + bukkit + nukkit)
        run: ./gradlew build --no-daemon

      - name: Show build output
        run: |
          ls -la bukkit/build/libs/
          ls -la nukkit/build/libs/

      - name: Upload Bukkit artifact
        uses: actions/upload-artifact@v4
        with:
          name: KBBSToper-Bukkit-CI
          path: bukkit/build/libs/KBBSToper-Bukkit-*.jar
          if-no-files-found: error

      - name: Upload Nukkit artifact
        uses: actions/upload-artifact@v4
        with:
          name: KBBSToper-Nukkit-CI
          path: nukkit/build/libs/KBBSToper-Nukkit-*.jar
          if-no-files-found: error
