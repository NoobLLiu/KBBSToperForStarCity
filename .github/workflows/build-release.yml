name: Build & Release (Bukkit)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Detect outbound proxy and export Gradle JVM opts
        run: |
          echo "Proxy env: HTTPS_PROXY=$HTTPS_PROXY HTTP_PROXY=$HTTP_PROXY"
          RAW="${HTTPS_PROXY:-${https_proxy:-${HTTP_PROXY:-${http_proxy}}}}"
          PROXY_HOST=""; PROXY_PORT=""
          if [ -n "$RAW" ]; then
            hostport=$(echo "$RAW" | sed -E 's#^[a-zA-Z]+://##')
            PROXY_HOST=$(echo "$hostport" | cut -d: -f1)
            PROXY_PORT=$(echo "$hostport" | cut -d: -f2)
          fi
          OPTS="-Djava.net.preferIPv4Stack=true"
          if [ -n "$PROXY_HOST" ] && [ -n "$PROXY_PORT" ]; then
            OPTS="$OPTS -Dhttp.proxyHost=$PROXY_HOST -Dhttp.proxyPort=$PROXY_PORT -Dhttps.proxyHost=$PROXY_HOST -Dhttps.proxyPort=$PROXY_PORT"
            echo "Using proxy $PROXY_HOST:$PROXY_PORT"
          else
            echo "No proxy detected; using direct connection"
          fi
          echo "JAVA_OPTS=$OPTS" >> "$GITHUB_ENV"
          echo "GRADLE_OPTS=$OPTS" >> "$GITHUB_ENV"

      - name: Build Bukkit jar (core + bukkit, shadowJar)
        run: ./gradlew :bukkit:build --no-daemon

      - name: Show build output
        run: ls -la bukkit/build/libs/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: KBBSToper-Bukkit
          path: bukkit/build/libs/KBBSToper-Bukkit-*.jar
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: ${{ github.ref_name }}
          files: bukkit/build/libs/KBBSToper-Bukkit-*.jar
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
