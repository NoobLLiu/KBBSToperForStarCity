name: Build & Release (Bukkit)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Egress probe
        run: |
          for u in \
            "https://services.gradle.org/distributions/gradle-8.7-bin.zip" \
            "https://downloads.gradle.org/distributions/gradle-8.7-bin.zip" \
            "https://repo1.maven.org/maven2/" \
            "https://repo.papermc.io/repository/maven-public/" \
            "https://repo.extendedclip.com/content/repositories/placeholderapi/" \
            "https://jitpack.io/" ; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 25 -I "$u" 2>/dev/null) || code="REFUSED"
            echo "$code  $u"
          done

      - name: Build Bukkit jar (core + bukkit, shadowJar)
        env:
          JAVA_OPTS: "-Djava.net.preferIPv4Stack=true"
          GRADLE_OPTS: "-Djava.net.preferIPv4Stack=true"
        run: ./gradlew :bukkit:build --no-daemon

      - name: Show build output
        run: ls -la bukkit/build/libs/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: KBBSToper-Bukkit
          path: bukkit/build/libs/KBBSToper-Bukkit-*.jar
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: ${{ github.ref_name }}
          files: bukkit/build/libs/KBBSToper-Bukkit-*.jar
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
