name: Build & Release (Bukkit, self-hosted)

# 触发方式（手动云端构建）：
#   1) 网页: 仓库 Actions 页 -> 本 workflow -> Run workflow -> 选 master
#   2) CLI:  gh workflow run "Build & Release (Bukkit, self-hosted)" --repo NoobLLiu/KBBSToperForStarCity
#   3) 推 tag: git tag -a vX.Y.Z -m "..." && git push origin --tags
#
# 重要：runs-on 使用 self-hosted。GitHub 托管的 ubuntu-latest runner 对本仓库存在
# JVM 出网隔离（curl 能联网但 Gradle 的 Java HTTP 客户端连不上 Maven / PaperMC 仓库），
# 导致插件与依赖解析失败。需在你自己的机器上注册一个 self-hosted runner 后本 workflow 才能跑通。
# 注册步骤见 https://github.com/NoobLLiu/KBBSToperForStarCity/settings/actions/runners
#
# 自托管 runner 要求：JDK 21（Gradle 8.7 + paper-api 1.21，不支持 JDK 25）、能正常访问外网。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Bukkit jar (core + bukkit, shadowJar)
        run: ./gradlew :bukkit:build --no-daemon

      - name: Show build output
        run: ls -la bukkit/build/libs/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: KBBSToper-Bukkit
          path: bukkit/build/libs/KBBSToper-Bukkit-*.jar
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: ${{ github.ref_name }}
          files: bukkit/build/libs/KBBSToper-Bukkit-*.jar
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
