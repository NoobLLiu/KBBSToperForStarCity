name: Build & Release (Bukkit)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Network diagnostics
        run: |
          echo "=== proxy env ==="; env | grep -i proxy || echo "no-proxy-env"
          echo "=== /etc/environment ==="; cat /etc/environment 2>/dev/null || echo none
          echo "=== /etc/curlrc ==="; cat /etc/curlrc 2>/dev/null || echo "no-curlrc"
          echo "=== resolve services.gradle.org ==="; getent hosts services.gradle.org || echo "resolve-fail"
          echo "=== curl -4 gradle ==="; curl -sS -o /dev/null -w "%{http_code}\n" --max-time 20 -4 https://services.gradle.org/distributions/gradle-8.7-bin.zip 2>&1 || echo "v4-refused"
          echo "=== curl -6 gradle ==="; curl -sS -o /dev/null -w "%{http_code}\n" --max-time 20 -6 https://services.gradle.org/distributions/gradle-8.7-bin.zip 2>&1 || echo "v6-refused"
          echo "=== curl -4 maven ==="; curl -sS -o /dev/null -w "%{http_code}\n" --max-time 20 -4 https://repo1.maven.org/maven2/ 2>&1 || echo "v4-refused"

      - name: Build Bukkit jar (core + bukkit, shadowJar)
        run: ./gradlew :bukkit:build --no-daemon

      - name: Show build output
        run: ls -la bukkit/build/libs/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: KBBSToper-Bukkit
          path: bukkit/build/libs/KBBSToper-Bukkit-*.jar
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: ${{ github.ref_name }}
          files: bukkit/build/libs/KBBSToper-Bukkit-*.jar
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
