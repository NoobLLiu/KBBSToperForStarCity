name: Build & Release (Bukkit)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Configure JVM network opts (force IPv6 preference)
        run: |
          # runner 出网对 services.gradle.org 等的 IPv4 路径被拒、IPv6 可达，
          # curl 能通而 Java HttpURLConnection 默认优先 IPv4 失败。
          # 用 JAVA_TOOL_OPTIONS 让所有 JVM(含 Gradle wrapper/daemon)优先 IPv6。
          echo "JAVA_TOOL_OPTIONS=-Djava.net.preferIPv6Addresses=true" >> "$GITHUB_ENV"
          echo "JAVA_OPTS=-Djava.net.preferIPv6Addresses=true" >> "$GITHUB_ENV"
          echo "GRADLE_OPTS=-Djava.net.preferIPv6Addresses=true" >> "$GITHUB_ENV"

      - name: Build Bukkit jar (core + bukkit, shadowJar)
        run: ./gradlew :bukkit:build --no-daemon

      - name: Show build output
        run: ls -la bukkit/build/libs/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: KBBSToper-Bukkit
          path: bukkit/build/libs/KBBSToper-Bukkit-*.jar
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: ${{ github.ref_name }}
          files: bukkit/build/libs/KBBSToper-Bukkit-*.jar
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
