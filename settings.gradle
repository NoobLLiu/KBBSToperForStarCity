pluginManagement {
    repositories {
        // 该 runner 上 repo.maven.apache.org 为 AAAA-only(无可用 A)被拒；
        // 旧别名 repo1.maven.org 有可用 IPv4，故显式指向它以解析 com.gradleup.shadow 等插件。
        maven { url = 'https://repo1.maven.org/maven2/' }
        gradlePluginPortal()
    }
}

rootProject.name = 'KBBSToper'

include 'core'
include 'bukkit'
include 'nukkit'
