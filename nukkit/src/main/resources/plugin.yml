name: KBBSToper
main: mc233.fun.kbbstoper.nukkit.KBBSToperNukkit
version: ${version}
api: ["1.0.0"]
load: POSTWORLD
author: mincHR549
description: 苦力怕论坛顶帖奖励插件（Nukkit）
commands:
    kbbstoper:
        description: KBBSToper主指令
        usage: /bt [help|binding|reward|testreward|list|top|check|delete|reload]
        aliases: [bt, poster]
        permission: bbstoper.user
permissions:
    bbstoper.admin:
        description: 管理员权限
        default: op
        children:
            bbstoper.testreward:
                description: 测试顶贴奖励
                default: op
            bbstoper.list:
                description: 列出顶贴列表
                default: op
            bbstoper.top:
                description: 将所有玩家按照顶贴次数排序
                # v2 GUI: 排行榜对玩家开放只读(GUI 内直接展示), 管理员仍持有
                default: true
            bbstoper.reload:
                description: 重载插件
                default: op
            bbstoper.check:
                description: 检查玩家ID和论坛ID
                default: op
            bbstoper.delete:
                description: 删除一个玩家的数据
                default: op
            bbstoper.debug:
                description: OP调试指令(清空/查看/模拟顶帖状态)
                default: op
            bbstoper.bypassquerycooldown:
                description: 绕过查询冷却
                default: op
            bbstoper.manage:
                description: 打开GUI管理菜单(v2)
                default: op
    bbstoper.user:
        description: 用户权限
        default: true
        children:
            bbstoper.binding:
                description: 绑定论坛账号
                default: true
            bbstoper.reward:
                description: 获取顶贴奖励
                default: true
