# 注意: 本字段必须与 build.gradle 的 version 一致!
# ConfigManager 每次启动比对版本号, 不一致时自动升级:
#   config.yml -> 键级迁移(保留你改过的有效配置, 移除已废弃项, 自动补齐新增项默认值),
#                 旧文件备份为 config_old.yml
#   lang.yml   -> 整体更新为新版文案, 旧文件备份为 lang_old.yml
version: 3.7.4_A14

#DEBUG模式
debug: false

website: "klpbbs.com"

#数据库设置
database:
    #表名前缀, 在sqlite和mysql都有效
    #可用两个单引号表示留空, 例如prefix: ''
    prefix: 'bt_'
    #定时自动断开并重新连接数据库
    #数据库使用长连接有可能导致速度越来越慢(我不确定)
    #可以尝试开启此选项, 单位秒, 设置为0则关闭
    timingreconnect: 0
    #可选mysql或sqlite
    type: 'sqlite'
    #mysql设置
    mysql:
        ip: 'localhost'
        port: '3306'
        database: 'databasename'
        user: 'username'
        password: 'password'
        ssl: false
    #sqlite设置
    sqlite:
        folder: '%PLUGIN_FOLDER%'
        database: 'bbstoper.db'

bbs:
    #服务器宣传贴的帖子id (StarCity 服默认宣传帖)
    url: '173068'
    #顶帖列表/玩家排名每页的大小
    pagesize: 10
    #玩家多久能更换一次绑定的id, 单位天
    changeidcooldown: 30
    #玩家多久能使用一次奖励指令以及查询指令, 单位秒
    querycooldown: 30
    #如果一个玩家没有顶贴是否在加入时发送提示消息
    joinmessage: true

# 代理设置
proxy:
    # 启用代理
    enable: false
    # 代理ip
    ip: '127.0.0.1'
    # 代理端口
    port: 10809

gui:
    #玩家排名的显示数量
    topplayers: 5
    #显示GUI中的头颅皮肤
    #获取头颅皮肤时有可能因为网络原因造成卡顿(我不确定)
    #如果在打开GUI时遇到主线程卡顿, 请尝试关闭此项
    displayheadskin: true
    #是否启用按键后输入绑定ID
    #如果某些插件导致玩家聊天事件消息被修改或者取消
    #那么插件将获取不到正确的输入，这时候请关闭此项
    usechatgetid: true
    #取消绑定的关键词
    #在点击了绑定按钮之后会通过监听聊天消息来获取bbs用户名
    #而输入这些关键词可以取消监听要绑定的id的操作
    cancelkeywords:
    - 'cancel'
    - '取消'

#=============================================================
# 奖励设置（StarCity 魔改版 · "累计奖励等级"模型）
#
# 模型说明:
#   每次有效顶帖 -> 奖励等级 +N(平峰 gain-normal / 高峰 gain-peak), 封顶 level.max
#   奖励等级决定玩家的持续增益:
#     生命上限 = values.hp-base + 奖励等级   (不超过 values.hp-hard-cap)
#     成长倍率 = 经验倍率 = 1 + 奖励等级 × level.multiplier-step
#   每次有效顶帖另发一次性奖励:
#     成长值 +values.growth-per-reward
#     星光点 +values.star-points (仅高峰期顶帖)
#   漏顶一天 -> 奖励等级 -level.decay-per-missed-day (按漏掉的天数累计)
#=============================================================
reward:
    #自动奖励间隔，循环访问宣传帖自动发奖，单位秒，0关闭
    #默认 600 = 每 10 分钟轮询一次（降低对论坛的请求压力）
    auto: 600
    #玩家手动点击"领取顶帖奖励"触发检查的冷却，单位秒
    #默认 600 = 10 分钟，独立于 list/top 的查询冷却(querycooldown)
    manual-cooldown: 600
    #顶贴后领取奖励的有效期, 单位天
    period: 10
    #同一个玩家距离上次顶贴多少分钟后再次顶贴才算有效, 0=一直有效
    #默认 120 = 每两次顶贴之间至少间隔 2 小时
    interval: 120
    #每日最多计入奖励的有效顶贴次数, 超出仅记录不奖励
    times: 3

    # ---- 高峰期时间段(服务器本地时间, 24小时制, 含 start 不含 end) ----
    # 默认高峰期 10:00-22:00; 其余时间为平峰期
    peak:
        start-hour: 10
        end-hour: 22

    # ---- 奖励等级 ----
    level:
        max: 20                      # 奖励等级上限
        gain-normal: 1               # 平峰期每次有效顶贴 提升的等级
        gain-peak: 2                 # 高峰期每次有效顶贴 提升的等级
        multiplier-step: 0.1         # 每级倍率增量(倍率 = 1 + 等级 × 本值; 满 20 级 = x3.0)
        decay-per-missed-day: 2      # 断签: 每漏掉一整天扣减的等级

    # ---- 数值(改这里即可) ----
    values:
        hp-base: 20                  # 生命上限基准(0 级 / 未顶过帖的玩家上限)
        hp-hard-cap: 50              # 生命上限硬上限(一排半爱心)
        growth-per-reward: 100       # 每次有效顶贴 发放成长值
        star-points: 300             # 高峰期顶贴 额外发放星光点(对接 EssentialsX 经济, 即 Essentials 金钱)

    # ---- MGactivity 导出接口命令模板(未注册 Java API 时的回退通道) ----
    # %PLAYER% = 玩家名; %VALUE% = 对应数值(由插件按当前奖励等级算出后填入)
    mgactivity:
        # 设置成长值倍率(绝对值)
        growth-multiplier-cmd: 'mgactivity setgrowthmultiplier %PLAYER% %VALUE%'
        # 设置经验值倍率(绝对值)
        experience-multiplier-cmd: 'mgactivity setexperiencemultiplier %PLAYER% %VALUE%'
        # 生命值上限(传入绝对目标值, KBBSToper 侧已钳制到 [hp-base, hp-hard-cap];
        # MGactivity 不要再二次抬到下界, 直接采用传入值即可)
        setmaxhp-cmd: 'mgactivity setmaxhp %PLAYER% %VALUE%'

    # ---- 成长值发放指令(每次有效顶贴发放 values.growth-per-reward) ----
    # 成长值(数值)走 MGactivity 控制台命令, 不经 Java API。
    # %PLAYER% = 玩家名, %VALUE% = 本次成长值(由插件按配置填入)。留空则不发放成长值。
    growth-grant-commands:
      - 'mgactivity addgrowthpoints %PLAYER% %VALUE%'

    # ---- 星光点发放通道(对接 EssentialsX 经济) ----
    # 优先走 EssentialsX 原生经济 API 直接给玩家加钱(即 Essentials 金钱);
    # 若服务器未安装 EssentialsX, 自动回退控制台命令 money give <玩家> <金额>。
    # (自 v3.7.4_A6 起已移除 Vault 依赖, 不再经 Vault 经济核心。)
