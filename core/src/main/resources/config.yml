#########################################
#                                       #
#       这里是KBBSToper的配置文件        #
#                                       #
#########################################

#原项目地址: https://github.com/R-Josef/BBSToper
#新构建地址:
#请定期检查这些网址以获取可用的更新
#Copyright © 2018-2020 R_Josef 版权所有

version: 3.7.4

#DEBUG模式
debug: false

website: "klpbbs.com"

#数据库设置
database:
    #表名前缀, 在sqlite和mysql都有效
    #可用两个单引号表示留空, 例如prefix: ''
    prefix: 'bt_'
    #定时自动断开并重新连接数据库
    #数据库使用长连接有可能导致速度越来越慢(我不确定)
    #可以尝试开启此选项, 单位秒, 设置为0则关闭
    timingreconnect: 0
    #可选mysql或sqlite
    type: 'sqlite'
    #mysql设置
    mysql:
        ip: 'localhost'
        port: '3306'
        database: 'databasename'
        user: 'username'
        password: 'password'
        ssl: false
    #sqlite设置
    sqlite:
        folder: '%PLUGIN_FOLDER%'
        database: 'bbstoper.db'

bbs:
    #服务器宣传贴的帖子id (StarCity 服默认宣传帖)
    url: '173068'
    #顶帖列表/玩家排名每页的大小
    pagesize: 10
    #玩家多久能更换一次绑定的id, 单位天
    changeidcooldown: 30
    #玩家多久能使用一次奖励指令以及查询指令, 单位秒
    querycooldown: 30
    #如果一个玩家没有顶贴是否在加入时发送提示消息
    joinmessage: true

# 代理设置
proxy:
    # 启用代理
    enable: false
    # 代理ip
    ip: '127.0.0.1'
    # 代理端口
    port: 10809

gui:
    #玩家排名的显示数量
    topplayers: 5
    #显示GUI中的头颅皮肤
    #获取头颅皮肤时有可能因为网络原因造成卡顿(我不确定)
    #如果在打开GUI时遇到主线程卡顿, 请尝试关闭此项
    displayheadskin: true
    #是否启用按键后输入绑定ID
    #如果某些插件导致玩家聊天事件消息被修改或者取消
    #那么插件将获取不到正确的输入，这时候请关闭此项
    usechatgetid: true
    #取消绑定的关键词
    #在点击了绑定按钮之后会通过监听聊天消息来获取bbs用户名
    #而输入这些关键词可以取消监听要绑定的id的操作
    cancelkeywords:
    - 'cancel'
    - '取消'

#奖励设置（StarCity 魔改版）
reward:
    #自动奖励间隔，循环访问宣传帖自动发奖，单位秒，0关闭
    auto: 30
    #顶贴后领取奖励的有效期, 单位天
    period: 10
    #同一个玩家距离上次顶贴多少分钟后再次顶贴才算有效, 0=一直有效
    #设计: 每两次顶贴之间至少间隔 2 小时
    interval: 120
    #每日顶贴奖励总次数上限(首顶+额外), 超出仅记录不奖励
    times: 3

    # ---- 时间段(服务器本地时间, 24小时制) ----
    #高峰期 10:00-22:00; 平峰期 22:00-10:00
    peak:
        start-hour: 10
        end-hour: 22

    # ---- 每日次数配额 ----
    daily:
        first-limit: 1   # 首顶奖励每日最多 1 次
        extra-limit: 2   # 额外顶贴奖励每日最多 2 次

    # 12 小时内全服无人顶贴 → 触发"附加顶贴奖励"
    # 与"处于高峰期"满足其一即触发(详见设计稿)
    inactive-hours-for-additional: 12

    # ---- 所有数值均可配置(改这里即可) ----
    values:
        growth-multiplier: 1.25        # 首顶: 当日成长值倍率
        experience-multiplier: 1.25    # 额外: 当日经验值倍率
        hp-step: 2                     # 首顶奖励 生命值上限 +2(额外顶贴不加 HP)
        hp-base: 30                    # 生命值下限(基准)
        hp-hard-cap: 50                # 生命值上限(一排半爱心, +30)
        growth-per-reward: 100         # 每次普通奖励 成长值 +100
        additional-hp-step: 2          # 附加奖励额外 生命值上限 +2
        additional-growth: 100         # 附加奖励 成长值 +100
        star-points: 300               # 附加奖励 星光点(走 Vault)
        streak-break-daily: 2          # 连签中断每日下降 2

    # ---- MGactivity 导出接口命令模板 ----
    # %PLAYER% = 玩家名; %VALUE% = 对应数值(由插件按配置填入)
    mgactivity:
        # 首顶: 设置当日成长值倍率
        growth-multiplier-cmd: 'mgactivity setgrowthmultiplier %PLAYER% %VALUE%'
        # 额外: 设置当日经验值倍率
        experience-multiplier-cmd: 'mgactivity setexperiencemultiplier %PLAYER% %VALUE%'
        # 生命值上限(传入绝对目标值, MGactivity 钳制到 [30,50])
        setmaxhp-cmd: 'mgactivity setmaxhp %PLAYER% %VALUE%'
        # 连签中断(收到即扣减)
        streak-break-cmd: 'mgactivity addstreakbreak %PLAYER% %VALUE%'

    # ---- 成长值 +100 的发放指令 ----
    # 说明: MGactivity 当前导出接口没有"加成长值"方法,
    # 此处填入你实际的成长值发放命令(每次普通/附加奖励都会执行一次)。
    # 若暂不接入, 留空即可(仅倍率/HP/星光点/连签生效)。
    growth-grant-commands: []
    #  - '你的成长值发放命令 %PLAYER% 100'

    # ---- 附加顶贴奖励(高峰期 或 12h 无人顶贴, 任一满足) ----
    additional:
        enable: true

    # ---- 星光点(走 Vault 经济核心, 不用命令) ----
    vault:
        enable-star-points: true
