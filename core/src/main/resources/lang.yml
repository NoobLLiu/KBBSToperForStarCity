#########################################
#                                       #
#       这里是KBBSToperForStarCity的语言文件        #
#                                       #
#########################################

#插件前缀
prefix: '&e[&dKBBSToperForStarCity&e] '

#载入
enable: '插件已启用!'
reload: '&a配置已重载!'

#数据库
failedconnectsql: '连接数据库时出错！'

#查询冷却
querycooldown: '&4查询操作正在冷却, 请在 %COOLDOWN% 秒后重试.'
manualcooldown: '&4领取奖励操作正在冷却, 请在 %COOLDOWN% 秒后重试.'

#列表通用
posternum: '&2顶帖数量&f'
overpage: '&4您输入的页码超出了总页数!'
posterid: '&2论坛ID&f'
#顶贴列表
postertime: '&2顶帖日期&f'
pageinfo: '&2当前/总页数:&f%PAGE%/%TOTALPAGE%&2, 翻页:&7/bt list <页码>'
noposter: '&4没有找到顶帖数据!'
#顶贴者列表
posterplayer: '&2玩家ID&f'
postertotal: '&2顶贴者数量&f'
pageinfotop: '&2当前/总页数:&f%PAGE%/%TOTALPAGE%&2, 翻页:&7/bt top <页码>'
noplayer: '&4没有找到玩家!'

#奖励
notbound: '&4您还未绑定账号!'
nopost: '&4您暂未有新的顶帖记录!'
overtime: '&4很抱歉您每天只能领取 &e%REWARDTIMES% &4次奖励!'
waitamin: '&4连续顶帖间隔必须大于一分钟!'
intervaltooshort: '&4您在 &f%TIME% &4的顶贴过于频繁, 您必须在距离上一次顶贴 &f%INTERVAL% &4分钟后再次顶贴才算有效.'
reward: '&b您在 &f%TIME% &b进行的顶帖已得到回报.'
rewardsummary: '&b您在 &f%TIME% &b的顶帖奖励: &f%DETAILS%'
extrareward: '&b您还获得了: %EXTRA%.'
rewardgived: '&a奖励发放完毕!'
broadcast: '&b玩家 &e%PLAYER% &b刚刚领取了顶贴奖励, 大家也快来顶贴吧! '

#绑定
enter: '&c请在聊天框输入您的论坛ID, 或输入下列关键词取消绑定: %KEYWORD%.'
canceled: '&c绑定已取消.'
repeat: '&c为防止输错ID, 请重复输入一次!'
notsame: '&4抱歉, 两次输入不一致，请重新输入!'
oncooldown: '&4抱歉您的账号正在绑定冷却中: &f%COOLDOWN% 天.'
samebind: '&4已有相同的绑定,如果这是您的ID,请联系管理!'
ownsamebind: '&4您已经绑定过相同ID!'
bindingsuccess: '&a绑定成功!'

#Check
idowner: '&b这个论坛ID的绑定者为: &e%PLAYER% &f(%UUID%).'
idnotfound: '&4未找到该论坛ID的记录.'
ownerid: '&b这名玩家绑定的论坛ID为: &f%ID%.'
ownernotfound: '&4未找到该玩家的记录.'

#删除
deletesuccess: '&c成功删除了该玩家的记录.'

#其他
nopermission: '&4对不起，您没有权限这么做!'
invalid: '&4命令错误!'
invalidnum: '&4无效的数字!'
playercmd: '&4该命令必须由玩家执行!'
pagenotvisible: '&4宣传帖目前处于不可视状态, 如果您看到这条消息请通知管理员!'
none: '&4 无'
failedgetweb: '获取网页时错误, 可能是由于网络波动!'
#failedresolveweb中的信息可能在您的宣传帖被移入审核区时反复出现
#您可以通过留空该项来禁用这项提示, 留空的格式应为-failedresolveweb: ''
failedresolveweb: '处理网页信息失败, 宣传帖目前可能不可视或被删除!'
faileduninstallmo: '未能按照预期卸载监听!'

#箱子GUI界面
gui:
    title: '%PREFIX%'
    frame: '&8我是边框'
    notbound: '&4未绑定KLPBBS账号'
    incentiverewards: '&b激励奖励'
    offdayrewards: '&b休息日奖励'
    pagenotvisible: '&c宣传帖目前处于不可视状态'

#基岩版表单界面(Nukkit端专用, Bukkit端忽略这一整节)
#表单的标题与正文不渲染颜色码, 插件会自动去掉颜色码后再显示
form:
    #主界面
    title: 'KBBSToperForStarCity'
    content: '论坛顶帖奖励'
    button:
        binding: '绑定论坛ID'
        rebinding: '更换论坛ID'
        reward: '领取顶帖奖励'
        top: '顶帖排行榜'
        post: '查看宣传帖'
    #绑定输入表单
    binding:
        title: '绑定论坛ID'
        label: '请输入你的 KLPBBS 论坛用户名(注意是用户名, 不是 uid)'
        input: '论坛ID'
        placeholder: '在此输入'
        empty: '&c论坛ID不能为空。'
    #宣传帖信息表单
    post:
        title: '本服宣传帖'
        content: '复制下面的链接在浏览器中打开'

#这里是玩家点击GUI中klpbbs宣传帖状态图标后发送的消息
#Bukkit端为可点击的聊天消息, Nukkit端会在表单中展示
clickposticon:
- '&8&l======================================'
- '&b点击打开本服KLPBBS宣传帖链接:'
- '&9%PAGE%'
- '&8&l======================================'

#提醒, 您可以在此添加更多消息
info:
- '&b本服KLPBBS宣传帖链接:'
- '&9%PAGE%'
- '&b对宣传帖使用提升卡将获得丰厚奖励.'
#额外奖励提醒
extrainfo: '&b现在顶贴还可以获得 %EXTRA% 哦.'

#帮助
help:
    title: '&3&lKBBSToperForStarCity指令帮助'
    help: '&3显示帮助信息: &b/bt help'
    binding: '&3绑定论坛账号: &b/bt binding <KLPBBS论坛ID>'
    reward: '&3获取奖励: &b/bt reward'
    testreward: '&3测试奖励: &b/bt testreward [ normal | incentive | offday ]'
    list: "&3查看顶帖列表: &b/bt list [页码]"
    top: "&3查看所有顶贴玩家排名: &b/bt top [页码]"
    check: '&3检查: &b/bt check < bbsid | player > <值>'
    delete: '&3删除某玩家的数据: &b/bt delete <玩家游戏ID>'
    reload: '&3重载插件: &b/bt reload'
    debug: '&3OP调试: &b/bt debug < clear | status | simulate >'

#OP调试指令
debug:
    clear: '&a已清空你的顶帖状态(今日已领次数/上次领奖日/HP上限已重置, 顶帖记录已清除).'
    status: '&b你的顶帖状态 — 论坛ID: &e%BBSNAME%&b, 上次领奖日: &e%REWARDBEFORE%&b, 今日已顶: &e%REWARDTIME%&b 次, HP上限: &e%MAXHP%'
    simulate: '&a已模拟一次"检测到你顶帖", 请查看奖励发放与控制台(MGactivity/Vault)响应.'

#=============================================================
# 双端新 GUI（v2 最终稿）共用文案
# JAVA(箱子) 与 基岩(表单) 共用这些占位符文案, 颜色码仅 JAVA 侧渲染
# 内置占位符: %BBSNAME% %POSTTIMES% %MAXHP% %REWARDTIME% %REWARDBEFORE%
#             %TODAYLIMIT% %COOLDOWN% %PAGEURL% %PREFIX%
#=============================================================
gui2:
    #我的状态
    status:
        title: '&3&l我的状态'
        bbsid: '&e论坛ID: &f%BBSNAME%'
        posttimes: '&e顶帖次数: &f%POSTTIMES%'
        maxhp: '&e生命上限: &f%MAXHP%'
        rewardtime: '&e今日已领: &f%REWARDTIME%/%TODAYLIMIT% 次'
        rewardbefore: '&e上次领奖日: &f%REWARDBEFORE%'
        today: '&e今日已领取: &f%TODAY%/%LIMIT% 次'
        first: '&e  • 首次顶帖: &f%FIRSTSTATE%'
        extra1: '&e  • 额外顶帖(1): &f%EXTRA1%'
        extra2: '&e  • 额外顶帖(2): &f%EXTRA2%'
        curhp: '&e当前生命上限: &f%CURHP%'
        curgm: '&e当前成长倍率: &f%CURGM%'
        curem: '&e当前经验倍率: &f%CUREM%'
        curgrowth: '&e当前成长值: &f%CURGROWTH%'
        curstar: '&e当前星光点: &f%CURSTAR%'
    #我的顶帖记录
    records:
        title: '&d&l我的顶帖记录'
        empty: '&7暂无顶帖记录'
    #顶帖排行榜
    top:
        title: '&6&l顶帖排行榜'
        empty: '&7暂无排行数据'
    #活动规则
    rules:
        title: '&6&l活动规则'
        peak: '&e【高峰期】&f%START%:00-%END%:00 顶帖 &7或 &f距上次全服顶帖超 %HOURS% 小时的新顶帖'
        offpeak: '&e【平峰期】&f%END%:00-%START%:00'
        limit: '&e【顶贴上限】&f每日首顶 %FIRST% 次 + 额外 %EXTRA% 次；超出仅记录不奖励；两次顶贴间隔≥%INTERVALH%小时；倍率不叠加，次日自动恢复'
        first: '&e【普通·每日首顶】&f成长倍率 %GROWTHMULT%、生命上限 +%HP%、成长值 +%GROWTH%'
        extra: '&e【普通·额外顶贴】&f经验倍率 %EXPMULT%、成长值 +%GROWTH%'
        additional: '&e【附加顶贴奖励】&f生命上限 +%ADHP%、成长值 +%ADGROWTH%、星光点 +%STAR%'
        hpcap: '&e【生命上限】&f可叠加最大至 %CAP%（+%ADD30% 血，一排半爱心）；连签中断每日下降 %STREAK%'
        cumulative: '&e【累计顶贴奖励】&f敬请期待'
    #管理菜单
    manage:
        title: '&c&l管理菜单'
        test: '&b测试奖励'
        list: '&b顶帖列表(全服)'
        check: '&b检查绑定'
        delete: '&c删除玩家数据'
        reload: '&a重载插件'
        debug: '&e调试'
    #测试奖励子菜单
    test:
        title: '&b&l测试奖励'
        normal: '&a普通奖励'
        incentive: '&e激励奖励'
        offday: '&b休息日奖励'
    #帮助
    help:
        title: '&3&l帮助'
        help: '&3/bt help - 帮助'
        binding: '&3/bt binding &lt;ID&gt; - 绑定论坛ID'
        reward: '&3/bt reward - 领取奖励'
        list: '&3/bt list - 顶帖列表(OP)'
        top: '&3/bt top - 排行榜'
        check: '&3/bt check - 检查(OP)'
        delete: '&3/bt delete - 删除(OP)'
        reload: '&3/bt reload - 重载(OP)'
        debug: '&3/bt debug - 调试(OP)'
    #通用
    back: '&7返回主菜单'
    prev: '&e上一页'
    next: '&e下一页'
    close: '&c关闭'
    main: '&a主菜单'
    page: '&7第 %PAGE%/%TOTAL% 页'
    #铁砧绑定界面
    anvil:
        title: '&b&l绑定论坛ID'
        guide: '&7在改名槽输入论坛ID, 点击输出物品确认'
        guide-player: '&7在改名槽输入玩家游戏ID, 点击输出物品确认'
        invalid: '&4论坛ID不合法: 仅允许字母/数字/下划线/中文, 长度1-32!'
        confirm: '&7再输入一次相同ID完成确认'

