    status:
        title: '我的状态'
    records:
        title: '我的顶帖记录'
        peak: '高峰期'
        offpeak: '平峰期'
        noreward: '已达每日上限, 无奖励'
    top:
        title: '顶帖排行榜'
    rules:
        title: '活动规则'
    manage:
        title: '管理菜单'
        test: '测试奖励'
        list: '顶帖列表(全服)'
        check: '检查绑定'
        delete: '删除玩家数据'
        reload: '重载插件'
        debug: '调试'
    test:
        title: '测试奖励'
        normal: '平峰期顶帖'
        incentive: '高峰期顶帖'
        offday: '满级效果预览'
        peak: '高峰期顶帖'
        max: '满级效果预览'
    input:
        title: '输入'
        label: '请输入:'
        placeholder: '在此输入'
        empty: '输入不能为空。'
    back: '返回主菜单'
    prev: '上一页'
    next: '下一页'
    page: '第 %PAGE%/%TOTAL% 页'